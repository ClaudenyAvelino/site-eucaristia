    <link rel="stylesheet" href="styles.css">

    <style>
        /* =====================================================
           PROTEÇÃO DA PÁGINA INICIAL
           ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        img {
            -webkit-user-drag: none;
            user-select: none;
            -webkit-user-select: none;
        }

        a {
            text-decoration: none;
            color: inherit;
        }


        /* =====================================================
           CABEÇALHO
           ===================================================== */

        header {
            background-color: #1e3a5f;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 26px;
            font-weight: bold;
        }


        /* =====================================================
           GALERIA
           ===================================================== */

        .galeria {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }


        /* =====================================================
           CARD
           ===================================================== */

        .card {
            position: relative;
            margin: 0;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
        }


        /* =====================================================
           LINK DO CLIENTE
           ===================================================== */

        .cliente-link {
            display: block;
            position: relative;
            cursor: pointer;
        }


        /* =====================================================
           IMAGEM
           ===================================================== */

        .card img {
            width: 100%;
            height: auto;
            display: block;

            pointer-events: none;

            -webkit-user-drag: none;
            user-drag: none;
        }


        /* =====================================================
           CAMADA DE PROTEÇÃO
           ===================================================== */

        .image-protection {
            position: absolute;
            inset: 0;
            z-index: 5;
            background: transparent;
        }


        /* =====================================================
           MARCA D'ÁGUA
           ===================================================== */

        .watermark {
            position: absolute;

            z-index: 6;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%) rotate(-25deg);

            width: 100%;

            text-align: center;

            color: rgba(255, 255, 255, 0.65);

            font-size: clamp(18px, 3vw, 32px);

            font-weight: bold;

            letter-spacing: 3px;

            text-transform: uppercase;

            white-space: nowrap;

            text-shadow:
                1px 1px 3px rgba(0, 0, 0, 0.7);

            pointer-events: none;
        }


        /* =====================================================
           NOME
           ===================================================== */

        .card figcaption {
            position: relative;
            z-index: 10;

            padding: 12px;

            font-size: 15px;

            color: #1e3a5f;

            font-weight: 600;

            background-color: #f9fbfd;
        }


        .card figcaption small {
            display: block;

            font-size: 12px;

            color: #25d366;

            margin-top: 4px;
        }


        /* =====================================================
           INDICAÇÃO
           ===================================================== */

        .acessar-galeria {
            display: block;

            margin-top: 5px;

            color: #0d6efd;

            font-size: 12px;

            font-weight: normal;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        footer {
            background-color: #d9dee3;

            text-align: center;

            padding: 20px;

            font-size: 14px;

            color: #333;
        }

        footer .social {
            margin-top: 12px;
        }

        footer .social a {
            margin: 0 12px;

            display: inline-flex;

            align-items: center;

            gap: 6px;

            color: #1e3a5f;

            font-weight: 500;

            transition:
                transform 0.2s,
                color 0.2s;
        }

        footer .social a:hover {
            color: #0d6efd;

            transform: translateY(-2px);
        }


        /* =====================================================
           WHATSAPP FLUTUANTE
           ===================================================== */

        .whatsapp-float {
            position: fixed;

            bottom: 20px;
            right: 20px;

            background-color: #25d366;

            padding: 12px;

            border-radius: 50%;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.2);

            z-index: 1000;
        }

        .whatsapp-float img {
            display: block;
        }


        /* =====================================================
           MENSAGEM DE PROTEÇÃO
           ===================================================== */

        #protection-message {
            position: fixed;

            bottom: 20px;
            left: 50%;

            transform: translateX(-50%);

            background: rgba(0, 0, 0, 0.88);

            color: white;

            padding: 12px 20px;

            border-radius: 8px;

            font-size: 14px;

            z-index: 99999;

            opacity: 0;

            pointer-events: none;

            transition: opacity 0.3s ease;
        }

        #protection-message.show {
            opacity: 1;
        }


        /* =====================================================
           RESPONSIVO
           ===================================================== */

        @media (max-width: 1024px) {

            .galeria {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 768px) {

            .galeria {
                grid-template-columns: repeat(2, 1fr);

                gap: 15px;

                padding: 15px;
            }

            header {
                font-size: 21px;
            }

        }

        @media (max-width: 480px) {

            .galeria {
                grid-template-columns: 1fr;

                padding: 12px;
            }

            header {
                font-size: 19px;
            }

        }
    </style>

</head>

    <script>

        /* =================================================
           ANO
           ================================================= */

        document.getElementById("ano").textContent =
            new Date().getFullYear();


        /* =================================================
           MENSAGEM
           ================================================= */

        function showProtectionMessage() {

            const message =
                document.getElementById("protection-message");

            message.classList.add("show");

            setTimeout(function () {

                message.classList.remove("show");

            }, 1800);

        }


        /* =================================================
           BOTÃO DIREITO
           ================================================= */

        document.addEventListener(
            "contextmenu",
            function (event) {

                event.preventDefault();

                showProtectionMessage();

            }
        );


        /* =================================================
           ARRASTAR
           ================================================= */

        document.addEventListener(
            "dragstart",
            function (event) {

                event.preventDefault();

            }
        );


        /* =================================================
           SELEÇÃO
           ================================================= */

        document.addEventListener(
            "selectstart",
            function (event) {

                event.preventDefault();

            }
        );


        /* =================================================
           COPIAR
           ================================================= */

        document.addEventListener(
            "copy",
            function (event) {

                event.preventDefault();

                showProtectionMessage();

            }
        );


        /* =================================================
           CUT
           ================================================= */

        document.addEventListener(
            "cut",
            function (event) {

                event.preventDefault();

            }
        );


        /* =================================================
           ATALHOS
           ================================================= */

        document.addEventListener(
            "keydown",
            function (event) {

                const key =
                    event.key.toLowerCase();


                /* PRINT SCREEN */

                if (event.key === "PrintScreen") {

                    event.preventDefault();

                    showProtectionMessage();

                    return;
                }


                /* F12 */

                if (event.key === "F12") {

                    event.preventDefault();

                    showProtectionMessage();

                    return;
                }


                /* CTRL + S */

                if (
                    event.ctrlKey &&
                    key === "s"
                ) {

                    event.preventDefault();

                    showProtectionMessage();

                    return;
                }


                /* CTRL + U */

                if (
                    event.ctrlKey &&
                    key === "u"
                ) {

                    event.preventDefault();

                    showProtectionMessage();

                    return;
                }


                /* CTRL + C */

                if (
                    event.ctrlKey &&
                    key === "c"
                ) {

                    event.preventDefault();

                    showProtectionMessage();

                    return;
                }


                /* CTRL + SHIFT + I */

                if (
                    event.ctrlKey &&
                    event.shiftKey &&
                    key === "i"
                ) {

                    event.preventDefault();

                    showProtectionMessage();

                    return;
                }


                /* CTRL + SHIFT + J */

                if (
                    event.ctrlKey &&
                    event.shiftKey &&
                    key === "j"
                ) {

                    event.preventDefault();

                    showProtectionMessage();

                    return;
                }


                /* CTRL + SHIFT + C */

                if (
                    event.ctrlKey &&
                    event.shiftKey &&
                    key === "c"
                ) {

                    event.preventDefault();

                    showProtectionMessage();

                    return;
                }

            }
        );


        /* =================================================
           ESCONDER AO PERDER FOCO
           ================================================= */

        document.addEventListener(
            "visibilitychange",
            function () {

                if (document.hidden) {

                    document.body.style.visibility =
                        "hidden";

                } else {

                    document.body.style.visibility =
                        "visible";

                }

            }
        );

    </script>
